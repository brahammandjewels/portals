<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HUID Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#B8975A;--gold-light:#D4B483;--gold-dark:#8C6F3E;
    --ink:#1A1A1A;--ink-muted:#5A5A5A;--ink-faint:#9A9A9A;
    --surface:#FAFAF8;--surface-alt:#F3F1EC;
    --border:rgba(184,151,90,0.2);--border-strong:rgba(184,151,90,0.45);
    --success:#2E6B4F;--error:#8B2E2E;--bg:var(--surface);--card:#fff;
  }
  body{
    font-family:'DM Sans',-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    padding:16px;padding-bottom:80px;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:linear-gradient(rgba(184,151,90,0.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(184,151,90,0.04) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0;
  }
  .page{position:relative;z-index:1;max-width:480px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .monogram{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,#B8975A,#8C6F3E);
    display:flex;align-items:center;justify-content:center;
    font-family:'DM Serif Display',serif;color:#fff;font-size:17px;flex-shrink:0;
    box-shadow:0 2px 6px rgba(184,151,90,0.3);
  }
  .brand h1{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;color:var(--ink);}
  .brand p{font-size:11px;color:var(--ink-faint);margin-top:1px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:22px;margin-bottom:16px;position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,0.04),0 4px 16px rgba(0,0,0,0.05);
  }
  .card::before{
    content:'';position:absolute;top:0;left:24px;right:24px;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    border-radius:0 0 3px 3px;
  }
  .section-label{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:10px;}
  .qr-scan-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px;border-radius:14px;margin-bottom:14px;
    background:var(--surface-alt);border:2px dashed var(--border-strong);
    color:var(--ink-muted);font-size:15px;font-weight:600;
    cursor:pointer;user-select:none;transition:background 0.15s;
  }
  .qr-scan-btn:active{background:var(--border);}
  #qrViewport{
    display:none;position:relative;width:100%;aspect-ratio:1/1;
    border-radius:14px;overflow:hidden;background:#000;margin-bottom:14px;
    border:2px solid var(--border-strong);
  }
  #qrVideo{width:100%;height:100%;object-fit:cover;display:block;}
  .qr-corners{position:absolute;inset:0;pointer-events:none;}
  .qr-close-btn{
    position:absolute;top:10px;right:10px;
    background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);
    color:#fff;border:none;border-radius:20px;
    padding:6px 14px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:'DM Sans',sans-serif;
  }
  .qr-status{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,0.65));
    color:rgba(255,255,255,0.85);text-align:center;
    font-size:13px;padding:18px 12px 14px;font-weight:500;
  }

  /* Tag input */
  .tag-input-wrap{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--surface-alt);border:2px solid var(--border-strong);
    border-radius:14px;padding:10px 12px;min-height:52px;cursor:text;
    transition:border-color 0.15s;
  }
  .tag-input-wrap:focus-within{border-color:var(--gold);}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--gold);color:#fff;
    font-size:14px;font-weight:700;font-family:'DM Serif Display',serif;
    padding:5px 10px;border-radius:8px;letter-spacing:0.5px;
  }
  .tag-x{
    font-size:16px;line-height:1;cursor:pointer;opacity:0.8;
    font-family:'DM Sans',sans-serif;font-weight:400;
  }
  .tag-x:hover{opacity:1;}
  #tagInput{
    border:none;outline:none;background:transparent;
    font-size:18px;font-family:'DM Serif Display',serif;
    color:var(--ink);min-width:120px;flex:1;padding:2px 0;
  }
  #tagInput::placeholder{color:var(--ink-faint);font-family:'DM Sans',sans-serif;font-size:14px;}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:8px;}

  /* Form fields */
  .field-label{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:6px;margin-top:16px;display:block;}
  .field-label:first-child{margin-top:0;}
  .field-input{
    width:100%;background:var(--surface-alt);border:2px solid var(--border-strong);
    border-radius:12px;padding:12px 14px;font-size:16px;font-family:'DM Sans',sans-serif;
    color:var(--ink);outline:none;transition:border-color 0.15s;
  }
  .field-input:focus{border-color:var(--gold);}
  .file-upload{
    width:100%;padding:14px;border-radius:12px;display:block;
    background:var(--surface-alt);border:2px dashed var(--border-strong);
    color:var(--ink-muted);font-size:14px;font-weight:500;
    cursor:pointer;text-align:center;margin-bottom:4px;
  }
  .file-name{font-size:12px;color:var(--success);margin-top:6px;font-weight:600;}

  /* Checkboxes */
  .check-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:12px;margin-top:8px;
    background:var(--surface-alt);border:1.5px solid var(--border);
    cursor:pointer;user-select:none;transition:border-color 0.15s;
  }
  .check-row.checked{border-color:var(--gold);background:#fff;}
  .check-box{
    width:22px;height:22px;border-radius:6px;flex-shrink:0;
    border:2px solid var(--border-strong);background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;transition:all 0.15s;
  }
  .check-row.checked .check-box{background:var(--gold);border-color:var(--gold);color:#fff;}
  .check-label{font-size:13px;color:var(--ink);font-weight:500;line-height:1.3;}

  .done-btn{
    width:100%;padding:20px;border-radius:14px;border:none;
    background:linear-gradient(135deg,#B8975A,#8C6F3E);
    color:#fff;font-size:18px;font-weight:700;margin-top:6px;
    box-shadow:0 4px 14px rgba(184,151,90,0.4);cursor:pointer;
    letter-spacing:0.02em;touch-action:manipulation;min-height:60px;
  }
  .done-btn:active{opacity:0.88;transform:scale(0.98);}
  .done-btn:disabled{opacity:0.5;transform:none;cursor:not-allowed;}

  .sub-line{font-size:12px;color:var(--ink-faint);margin-bottom:18px;}
  .sub-line span{text-decoration:underline;cursor:pointer;color:var(--gold-dark);font-weight:600;}
  .setup-overlay{
    position:fixed;inset:0;background:var(--bg);
    display:flex;flex-direction:column;justify-content:center;padding:28px;z-index:99;
  }
  .setup-overlay h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink);margin-bottom:6px;}
  .setup-overlay p{color:var(--ink-faint);font-size:13px;margin-bottom:22px;}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chip{
    text-align:center;padding:20px 8px;border-radius:12px;font-size:16px;font-weight:600;
    border:1.5px solid var(--border);background:var(--card);color:var(--ink);
    cursor:pointer;user-select:none;touch-action:manipulation;
    min-height:64px;display:flex;align-items:center;justify-content:center;
  }
  .chip:active{background:var(--surface-alt);}
  .toast{
    position:fixed;top:18px;left:18px;right:18px;
    padding:13px;border-radius:12px;text-align:center;font-size:14px;font-weight:600;
    opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:50;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
  }
  .toast.success{background:var(--success);color:#fff;}
  .toast.fail{background:var(--error);color:#fff;}
  .toast.show{opacity:1;}
  #formSection{display:none;}

  .footer-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;z-index:20;}
.footer-status{display:flex;align-items:center;gap:6px;color:var(--ink-muted);}
.footer-dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
.footer-dot.offline{background:var(--warn);}
.footer-link{color:var(--gold-dark);cursor:pointer;text-decoration:underline;font-weight:600;font-size:12px;background:none;border:none;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="setup-overlay" id="setupOverlay" style="display:none;">
  <h2>Who are you?</h2>
  <p>Pick your name — it stays saved on this device.</p>
  <div class="setup-grid" id="setupGrid"></div>
</div>

<div class="page">
  <div class="brand">
    <div class="monogram">💎</div>
    <div>
      <h1>HUID</h1>
      <p>Brahammand Jewels — Production Tracker</p>
    </div>
  </div>
  <div class="sub-line">Logged in as: <b id="currentUser">—</b> · <span id="changeUser">change</span></div>

  <!-- Scan card -->
  <div class="card">
    <div class="section-label">Scan or Type Order Numbers</div>
    <div class="qr-scan-btn" id="qrScanBtn">
      <span style="font-size:24px;">📷</span>
      <span>Tap to scan QR code</span>
    </div>
    <div id="qrViewport">
      <video id="qrVideo" autoplay playsinline muted></video>
      <svg class="qr-corners" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M10,22 L10,10 L22,10" stroke="#B8975A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M78,10 L90,10 L90,22" stroke="#B8975A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M10,78 L10,90 L22,90" stroke="#B8975A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M90,78 L90,90 L78,90" stroke="#B8975A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <button class="qr-close-btn" id="qrCloseBtn">✓ Done scanning</button>
      <div class="qr-status" id="qrStatus">Starting camera…</div>
    </div>
    <div class="tag-input-wrap" id="tagWrap" onclick="document.getElementById('tagInput').focus()">
      <input id="tagInput" type="number" inputmode="numeric" placeholder="or type here…" autocomplete="off">
    </div>
    <div class="hint">Scan a QR OR type a number → Enter / Space to add.</div>
  </div>

    <div id="orderCards"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
(function() {
  var APPS_SCRIPT_URL = 'https://script.google.com/a/macros/brahammandjewels.com/s/AKfycbwaBd1DOgSQmWMSoLFAHPyhnjFICEXJC4-e18IuAHQMkF7iDX5Z4ZLYKG-jIv6t3yqD/exec';
  var TEAM = [
    { code: 'MR', name: 'Mr Sir' },
    { code: 'RJ', name: 'Raj' },
    { code: 'P',  name: 'Pranav' },
    { code: 'HS', name: 'Harsh' }
  ];
  var USER_KEY = 'huid_device_user_v1';
    var orders = []; // array of { orderNo, netWeight, wastage, imageBase64, imageName, imageMime, crossCheck, laserMarking, accountsChitti, orderComplete }

  // ── User setup ──
  function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch(e){ return null; } }
  function setUser(u) {
    localStorage.setItem(USER_KEY, JSON.stringify(u));
    document.getElementById('currentUser').textContent = u.name;
    document.getElementById('setupOverlay').style.display = 'none';
  }
  function renderSetup() {
    var grid = document.getElementById('setupGrid');
    grid.innerHTML = '';
    TEAM.forEach(function(u) {
      var el = document.createElement('div');
      el.className = 'chip';
      el.textContent = u.name;
      el.onclick = function() { setUser(u); };
      grid.appendChild(el);
    });
  }
  document.getElementById('changeUser').onclick = function() { document.getElementById('setupOverlay').style.display = 'flex'; };
  var existingUser = getUser();
  if (existingUser) document.getElementById('currentUser').textContent = existingUser.name;
  else document.getElementById('setupOverlay').style.display = 'flex';
  renderSetup();

  // ── Toast ──
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'success');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  // ── Tags ──
    function addOrder(num) {
    num = String(num).trim();
    if (!num) return;
    if (orders.some(function(o){ return o.orderNo === num; })) { showToast(num + ' already added', 'fail'); return; }
    if (orders.length >= 5) { showToast('Max 5 orders at a time', 'fail'); return; }
    orders.push({ orderNo: num, netWeight: '', wastage: '0', imageBase64: '', imageName: '', imageMime: '', crossCheck: false, laserMarking: false, accountsChitti: false, orderComplete: false });
    renderTags();
    document.getElementById('tagInput').value = '';
  }

    function removeOrder(num) {
    orders = orders.filter(function(o){ return o.orderNo !== num; });
    renderTags();
  }

    function renderTags() {
    var wrap = document.getElementById('tagWrap');
    var input = document.getElementById('tagInput');
    wrap.querySelectorAll('.tag').forEach(function(el){ el.remove(); });
    orders.forEach(function(item) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = item.orderNo + ' <span class="tag-x" onclick="removeOrderTag(\'' + item.orderNo + '\')">×</span>';
      wrap.insertBefore(tag, input);
    });
    renderOrderCards();
  }

  window.removeOrderTag = function(num) { removeOrder(num); };

  function renderOrderCards() {
    var container = document.getElementById('orderCards');
    container.innerHTML = '';
    orders.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'card';
      card.style.marginBottom = '12px';
      card.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
          '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--ink);">' + item.orderNo + '</div>' +
        '</div>' +
        '<label class="field-label" style="margin-top:0;">Net Weight (g)</label>' +
        '<input class="field-input" type="number" inputmode="decimal" step="0.01" placeholder="e.g. 5.25" value="' + item.netWeight + '" data-field="netWeight" data-order="' + item.orderNo + '">' +
        '<label class="field-label">Wastage (g)</label>' +
        '<input class="field-input" type="number" inputmode="decimal" step="0.01" placeholder="0" value="' + item.wastage + '" data-field="wastage" data-order="' + item.orderNo + '">' +
        '<label class="field-label" style="margin-top:16px;">HUID Image</label>' +
        '<label class="file-upload" for="img_' + item.orderNo + '">📎 ' + (item.imageName || 'Tap to attach image') + '</label>' +
        '<input type="file" id="img_' + item.orderNo + '" accept="image/*" capture="environment" data-order="' + item.orderNo + '" style="display:none">' +
        '<label class="field-label" style="margin-top:16px;">Confirmations</label>' +
        ['crossCheck','laserMarking','accountsChitti','orderComplete'].map(function(key) {
          var labels = { crossCheck:'Cross-Check Item Detail confirmed', laserMarking:'Laser Marking done', accountsChitti:'Accounts Chitti confirmed', orderComplete:'Order Complete' };
          var checked = item[key];
          return '<div class="check-row' + (checked?' checked':'') + '" data-check="' + key + '" data-order="' + item.orderNo + '">' +
            '<div class="check-box">' + (checked ? '✓' : '') + '</div>' +
            '<div class="check-label">' + labels[key] + '</div>' +
          '</div>';
        }).join('');

      // wire inputs
      card.querySelectorAll('.field-input').forEach(function(inp) {
        inp.addEventListener('input', function() {
          var o = orders.find(function(x){ return x.orderNo === inp.dataset.order; });
          if (o) o[inp.dataset.field] = inp.value;
        });
      });
      // wire file
      var fileInp = card.querySelector('input[type=file]');
      fileInp.addEventListener('change', function() {
  var o = orders.find(function(x){ return x.orderNo === fileInp.dataset.order; });
  if (!o || !fileInp.files[0]) return;
  var f = fileInp.files[0];
  o.imageName = f.name;
  o.imageMime = 'image/jpeg';
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var now = new Date();
      var dd = String(now.getDate()).padStart(2,'0');
      var mm = String(now.getMonth()+1).padStart(2,'0');
      var yyyy = now.getFullYear();
      var hh = String(now.getHours()).padStart(2,'0');
      var min = String(now.getMinutes()).padStart(2,'0');
      var ss = String(now.getSeconds()).padStart(2,'0');
      var stamp = dd+'/'+mm+'/'+yyyy+'  '+hh+':'+min+':'+ss+'  |  Brahammand Jewels';
      var barH = Math.max(36, img.height * 0.06);
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, img.height - barH, img.width, barH);
      var fontSize = Math.max(14, Math.floor(barH * 0.5));
      ctx.font = 'bold ' + fontSize + 'px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'middle';
      ctx.fillText(stamp, 12, img.height - barH / 2);
      o.imageBase64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
      card.querySelector('.file-upload').textContent = '📎 ' + f.name;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
});
      // wire checkboxes
      card.querySelectorAll('.check-row').forEach(function(row) {
        row.addEventListener('click', function() {
          var o = orders.find(function(x){ return x.orderNo === row.dataset.order; });
          if (!o) return;
          var key = row.dataset.check;
          o[key] = !o[key];
          row.classList.toggle('checked', o[key]);
          row.querySelector('.check-box').textContent = o[key] ? '✓' : '';
        });
      });

      container.appendChild(card);
    });

    // Submit button at bottom
    if (orders.length > 0) {
      var btn = document.createElement('button');
      btn.className = 'done-btn';
      btn.id = 'doneBtn';
      btn.style.marginBottom = '16px';
      btn.textContent = '💎 Submit HUID Done (' + orders.length + ')';
      btn.addEventListener('click', handleSubmit);
      container.appendChild(btn);
    }
  }

  document.getElementById('tagInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var val = this.value.trim();
      if (val) addOrder(val);
    }
    if (e.key === 'Backspace' && this.value === '' && orders.length > 0) {
      removeOrder(orders[orders.length - 1]);
    }
  });

  // ── QR Scanner ──
  var qrStream = null, qrControls = null, codeReader = null;
  function stopCamera() {
    if (qrControls) { try { qrControls.stop(); } catch(e){} qrControls = null; }
    if (qrStream)   { qrStream.getTracks().forEach(function(t){ t.stop(); }); qrStream = null; }
    document.getElementById('qrVideo').srcObject = null;
    document.getElementById('qrViewport').style.display = 'none';
    document.getElementById('qrScanBtn').style.display  = 'flex';
  }
  document.getElementById('qrCloseBtn').addEventListener('click', stopCamera);
  document.getElementById('qrScanBtn').addEventListener('click', function() {
    if (!window.ZXing) { showToast('Scanner still loading — try again', 'fail'); return; }
    document.getElementById('qrScanBtn').style.display  = 'none';
    document.getElementById('qrViewport').style.display = 'block';
    document.getElementById('qrStatus').textContent     = 'Starting camera…';
    if (!codeReader) codeReader = new ZXing.BrowserQRCodeReader();
    var lastScanned = '', lastScannedAt = 0;
    codeReader.decodeFromVideoDevice(undefined, document.getElementById('qrVideo'), function(result, err) {
      if (result) {
        var num = result.getText().replace(/\D/g, '');
        var now = Date.now();
        if (num && (num !== lastScanned || now - lastScannedAt > 3000)) {
          lastScanned = num; lastScannedAt = now;
          if (navigator.vibrate) navigator.vibrate(60);
          document.getElementById('qrStatus').textContent = '✓ ' + num + ' added';
          addOrder(num);
        }
      } else if (err && !(err instanceof ZXing.NotFoundException)) {
        document.getElementById('qrStatus').textContent = 'Error: ' + err.message;
      }
    })
    .then(function(controls) {
      qrControls = controls;
      if (document.getElementById('qrVideo').srcObject) qrStream = document.getElementById('qrVideo').srcObject;
      document.getElementById('qrStatus').textContent = 'Point at a QR code';
    })
    .catch(function(err) { stopCamera(); showToast('Camera error: ' + (err.name || err.message), 'fail'); });
  });

    function resetAll() {
    orders = [];
    renderTags();
  }

  // ── Submit ──
  function handleSubmit() {
    if (orders.length === 0) { showToast('Add at least one order', 'fail'); return; }
    var u = getUser();
    if (!u) { document.getElementById('setupOverlay').style.display = 'flex'; return; }
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i];
      if (!o.netWeight || parseFloat(o.netWeight) <= 0) { showToast('Enter net weight for ' + o.orderNo, 'fail'); return; }
      if (!o.crossCheck)     { showToast('Cross-Check not confirmed for ' + o.orderNo, 'fail'); return; }
      if (!o.accountsChitti) { showToast('Accounts Chitti not confirmed for ' + o.orderNo, 'fail'); return; }
    }
    var doneBtn = document.getElementById('doneBtn');
    if (doneBtn) { doneBtn.disabled = true; doneBtn.textContent = 'Submitting…'; }

      function doSubmit() {
      var payload = orders.map(function(item) {
        return {
          processes:      ['HUIDDone'],
          orderNo:        item.orderNo,
          scannedBy:      u.name,
          netWeight:      item.netWeight,
          wastage:        item.wastage || 0,
          imageBase64:    item.imageBase64 || '',
          imageName:      item.imageName   || '',
          imageMime:      item.imageMime   || '',
          crossCheck:     item.crossCheck,
          laserMarking:   item.laserMarking,
          accountsChitti: item.accountsChitti,
          orderComplete:  item.orderComplete
        };
      });

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(function(r){ return r.json(); })
            .then(function(res) {
        var b = document.getElementById('doneBtn'); if(b){b.disabled=false;b.textContent='💎 Submit HUID Done ('+orders.length+')';}
        var allDone = res.results && res.results.every(function(r){ return r.status === 'done'; });
        if (allDone) {
          payload.forEach(function(item){ saveToQueue(item, 'synced'); });
          showToast('💎 HUID Done — ' + payload.map(function(p){return p.orderNo;}).join(', '), 'success');
          resetAll();
        } else {
          payload.forEach(function(item){ saveToQueue(item, 'error'); });
          var errors = (res.results || []).filter(function(r){ return r.status !== 'done'; });
          showToast('Error: ' + (errors[0] && errors[0].message || 'unknown'), 'fail');
        }
      })
      .catch(function() {
        var b = document.getElementById('doneBtn'); if(b){b.disabled=false;b.textContent='💎 Submit HUID Done ('+orders.length+')';}
        payload.forEach(function(item){ saveToQueue(item, 'pending'); });
        showToast('Offline — saved locally', 'fail');
      });
    }

          // Queue-first: save instantly, process in background
    var u2 = getUser();
    orders.forEach(function(item) {
      var entry = {
        orderNo:        item.orderNo,
        scannedBy:      u2 ? u2.name : '',
        netWeight:      item.netWeight,
        wastage:        item.wastage || '0',
        imageBase64:    item.imageBase64 || '',
        imageName:      item.imageName   || '',
        imageMime:      item.imageMime   || '',
        crossCheck:     item.crossCheck,
        laserMarking:   item.laserMarking,
        accountsChitti: item.accountsChitti,
        orderComplete:  item.orderComplete,
        ts:             new Date().toISOString(),
        syncStatus:     'pending'
      };
      saveToQueue(entry);
    });
    showToast('✓ Saved — syncing in background…', 'success');
    resetAll();
    updateFooter();
    trySyncQueue();
  }

  var QUEUE_KEY = 'huid_queue_v1';

  function saveToQueue(entry) {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      q.push(entry);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
    } catch(e) {}
  }

  function getQueue() {
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch(e) { return []; }
  }

  function trySyncQueue() {
    if (!navigator.onLine) return;
    var q = getQueue();
    var pending = q.filter(function(e){ return e.syncStatus === 'pending'; });
    if (pending.length === 0) return;

    var payload = pending.map(function(item) {
      return {
        processes:      ['HUIDDone'],
        orderNo:        item.orderNo,
        scannedBy:      item.scannedBy,
        netWeight:      item.netWeight,
        wastage:        item.wastage || 0,
        imageBase64:    item.imageBase64 || '',
        imageName:      item.imageName   || '',
        imageMime:      item.imageMime   || '',
        crossCheck:     item.crossCheck,
        laserMarking:   item.laserMarking,
        accountsChitti: item.accountsChitti,
        orderComplete:  item.orderComplete
      };
    });

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json(); })
    .then(function(res) {
      var q2 = getQueue();
      (res.results || []).forEach(function(r) {
        var idx = q2.findIndex(function(e){ return e.orderNo === r.orderNo && e.syncStatus === 'pending'; });
        if (idx !== -1) q2[idx].syncStatus = r.status === 'done' ? 'synced' : 'error';
      });
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q2));
      updateFooter();
    })
    .catch(function(){ /* stay pending, retry next time */ });
  }

  function updateFooter() {
    var q = getQueue();
    var pending = q.filter(function(e){ return e.syncStatus === 'pending'; }).length;
    var dot  = document.getElementById('footerDot');
    var cnt  = document.getElementById('footerPending');
    var online = navigator.onLine;
    if (dot)  { dot.className = 'footer-dot' + (online ? '' : ' offline'); }
    if (cnt)  { cnt.textContent = pending + ' pending'; }
  }

  window.addEventListener('online',  function(){ updateFooter(); trySyncQueue(); });
  window.addEventListener('offline', function(){ updateFooter(); });

  trySyncQueue();
  updateFooter();
})();
</script>

<div class="footer-bar">
  <div class="footer-status">
    <div class="footer-dot" id="footerDot"></div>
    <span id="footerOnline">Online</span>
    &nbsp;·&nbsp;
    <span id="footerPending">0 pending</span>
  </div>
  <div class="footer-actions">
    <button class="footer-link" onclick="trySyncQueue();updateFooter();">Sync now</button>
  </div>
</div>
</body>
</html>
